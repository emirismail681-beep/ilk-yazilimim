<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Rengarenk Tıklama Oyunu 🚀</title>
    <!-- Yasal ve Güvenli Konfeti Kütüphanesi -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        /* Yumuşak ve Geçişli Arka Plan Renk Animasyonu */
        body {
            text-align: center;
            font-family: sans-serif;
            color: white;
            padding-top: 30px;
            margin: 0;
            height: 100vh;
            background: linear-gradient(45deg, #12141d, #1a2035, #2c1a35, #1a352b);
            background-size: 400% 400%;
            animation: renkGecisi 25s ease infinite; /* 25 saniyede bir fark edilmeden döner */
        }

        @keyframes renkGecisi {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Küçük Animasyon Dokunuşları */
        .butor {
            transition: transform 0.1s, background-color 0.3s;
        }
        .butor:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Üst Skor ve Durum Paneli -->
    <h2 style="color: #cbd5e0; margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">Mevcut Seviye: <span id="seviyeYazisi" style="color: #63b3ed;">1</span></h2>
    <h1 style="text-shadow: 2px 2px 4px rgba(0,0,0,0.6);">Puan: <span id="skorYazisi" style="color: #f6ad55; font-size: 50px;">0</span></h1>
    <p style="color: #e2e8f0; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Tıklama Gücü: <span id="tiklamaGucuYazisi" style="color: #68d391; font-weight: bold;">1</span> | Pasif Gelir: saniyede <span id="otoGucYazisi" style="color: #fc8181; font-weight: bold;">0</span> puan</p>

    <br>

    <!-- Ana Tıklama Butonu -->
    <button onclick="puanArtir()" class="butor"
            style="padding: 25px 50px; font-size: 24px; cursor: pointer; background-color: #e53e3e; color: white; border: none; border-radius: 12px; font-weight: bold; box-shadow: 0 6px #9b2c2c;">
        TIKLA! 🎯
    </button>

    <br><br><br>

    <!-- Geliştirme Mağazası Paneli -->
    <div style="display: flex; justify-content: center; gap: 20px;">
        
        <!-- 1. Geliştirme: Seviye Atla -->
        <div style="background-color: rgba(45, 55, 72, 0.7); backdrop-filter: blur(5px); padding: 20px; border-radius: 10px; border: 1px solid #4a5568; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <h3 style="margin-top: 0;">Seviye Atla! 💪</h3>
            <p style="font-size: 14px; color: #cbd5e0;">Maliyet: <span id="maliyetYazisi" style="color: #f6ad55; font-weight: bold;">10</span></p>
            <button id="gelistirmeButonu" onclick="seviyeAtla()" class="butor"
                    style="padding: 12px 24px; font-size: 16px; cursor: not-allowed; background-color: #4a5568; color: #718096; border: none; border-radius: 6px; font-weight: bold;" disabled>
                Kilitli 🔒
            </button>
        </div>

        <!-- 2. Geliştirme: Otomatik Madenci Satın Al -->
        <div style="background-color: rgba(45, 55, 72, 0.7); backdrop-filter: blur(5px); padding: 20px; border-radius: 10px; border: 1px solid #4a5568; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <h3 style="margin-top: 0;">Madenci Kirala! ⛏️</h3>
            <p style="font-size: 14px; color: #cbd5e0;">Maliyet: <span id="madenciMaliyetYazisi" style="color: #f6ad55; font-weight: bold;">20</span></p>
            <button id="madenciButonu" onclick="madenciAl()" class="butor"
                    style="padding: 12px 24px; font-size: 16px; cursor: not-allowed; background-color: #4a5568; color: #718096; border: none; border-radius: 6px; font-weight: bold;" disabled>
                Kilitli 🔒
            </button>
        </div>

    </div>

    <!-- Oyunun Kod Mantığı -->
    <script>
        let puan = 0;
        let seviye = 1;
        let tiklamaGucu = 1;
        let sonrakiMaliyet = 10;
        
        let madenciSayisi = 0;
        let madenciMaliyeti = 20;

        // Pasif Gelir Döngüsü
        setInterval(function() {
            puan = puan + (madenciSayisi * 1);
            ekraniGuncelle();
        }, 1000);

        function puanArtir() {
            puan = puan + tiklamaGucu;
            ekraniGuncelle();
        }

        function seviyeAtla() {
            if (puan >= sonrakiMaliyet) {
                puan = puan - sonrakiMaliyet;
                seviye = seviye + 1;
                tiklamaGucu = tiklamaGucu + 1;
                sonrakiMaliyet = sonrakiMaliyet * 2.5;
                
                // Konfeti Patlatma Efekti 🎉
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                ekraniGuncelle();
            }
        }

        function madenciAl() {
            if (puan >= madenciMaliyeti) {
                puan = puan - madenciMaliyeti;
                madenciSayisi = madenciSayisi + 1;
                madenciMaliyeti = madenciMaliyeti * 2;
                ekraniGuncelle();
            }
        }

        function ekraniGuncelle() {
            document.getElementById("skorYazisi").innerText = Math.floor(puan);
            document.getElementById("seviyeYazisi").innerText = seviye;
            document.getElementById("tiklamaGucuYazisi").innerText = tiklamaGucu;
            document.getElementById("maliyetYazisi").innerText = Math.floor(sonrakiMaliyet);
            document.getElementById("otoGucYazisi").innerText = madenciSayisi;
            document.getElementById("madenciMaliyetYazisi").innerText = Math.floor(madenciMaliyeti);

            // Seviye Buton Kontrolü
            let btnSeviye = document.getElementById("gelistirmeButonu");
            if (puan >= sonrakiMaliyet) {
                btnSeviye.style.backgroundColor = "#38a169";
                btnSeviye.style.color = "white";
                btnSeviye.style.cursor = "pointer";
                btnSeviye.innerText = "SEVİYE ATLA! ⚡";
                btnSeviye.disabled = false;
            } else {
                btnSeviye.style.backgroundColor = "#4a5568";
                btnSeviye.style.color = "#718096";
                btnSeviye.style.cursor = "not-allowed";
                btnSeviye.innerText = "Kilitli 🔒";
                btnSeviye.disabled = true;
            }

            // Madenci Buton Kontrolü
            let btnMadenci = document.getElementById("madenciButonu");
            if (puan >= madenciMaliyeti) {
                btnMadenci.style.backgroundColor = "#3182ce";
                btnMadenci.style.color = "white";
                btnMadenci.style.cursor = "pointer";
                btnMadenci.innerText = "MADENCİ AL! ⛏️";
                btnMadenci.disabled = false;
            } else {
                btnMadenci.style.backgroundColor = "#4a5568";
                btnMadenci.style.color = "#718096";
                btnMadenci.style.cursor = "not-allowed";
                btnMadenci.innerText = "Kilitli 🔒";
                btnMadenci.disabled = true;
            }
        }
    </script>

</body>
</html>
